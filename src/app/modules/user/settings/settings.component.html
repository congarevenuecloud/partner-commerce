<nav class="border-bottom navbar-light bg-white d-flex justify-content-between">
  <span class="navbar-brand">
    {{'MY_ACCOUNT.SETTING.MY_SETTINGS' | translate}}
  </span>
</nav>

<div class="row my-3 pb-5 pt-2">
  <div class="col-sm-12 col-md-12 col-lg-6 mb-2">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title d-flex justify-content-between">
          <span>{{'MY_ACCOUNT.SETTING.USER_INFO' | translate}}</span>
        </h5>
        @if (user$ | async; as user) {
        <dl class="mt-4">
          <dd>
            <apt-output-field [record]="user" field="FirstName" [layout]="'stacked'" [labelClass]="'fw-light'" (onChange)="updateUser($event)">
            </apt-output-field>
          </dd>

          <dd>
            <apt-output-field [record]="user" field="LastName" [layout]="'stacked'" [labelClass]="'fw-light'" (onChange)="updateUser($event)">
            </apt-output-field>
          </dd>

          <dd>
            <apt-output-field [record]="user" field="Email" [layout]="'stacked'" [labelClass]="'fw-light'" (onChange)="updateUser($event)">
            </apt-output-field>
          </dd>

          <dd>
            <apt-output-field [record]="user" field="UserName" [layout]="'stacked'" [labelClass]="'fw-light'" (onChange)="updateUser($event)">
            </apt-output-field>
          </dd>

          <dd>
            <apt-output-field [record]="user" field="Locale" [layout]="'stacked'" [labelClass]="'fw-light'" (onChange)="updateUser($event)" [editable]="false">
            </apt-output-field>
          </dd>

        </dl>
        } @else {
          <div class="d-flex justify-content-center py-5">
            <apt-dots></apt-dots>
          </div>
        }
      </div>
    </div>
  </div>
  <div class="col-sm-12 col-md-12 col-lg-6 mb-2">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title mb-3">{{'MY_ACCOUNT.SETTING.ACCOUNT_INFO' | translate}}</h5>
        @if (account$ | async; as account) {
        <dl class="mt-4">
          <dd>
            <apt-output-field [record]="account" field="Name" [layout]="'stacked'" [labelClass]="'fw-light'" [editable]="false"></apt-output-field>
          </dd>

          <dd class="pb-2">
            <apt-address [value]="account" [type]="'Shipping'" [readonly]="true" [layout]="'stacked'" [labelClass]="'fw-light'"
              [label]="'COMMON.SHIPPING_ADDRESS' | translate"></apt-address>
          </dd>

          <dd>
            <apt-output-field [record]="account" field="Phone" [layout]="'stacked'" [labelClass]="'fw-light'" [editable]="false">
            </apt-output-field>
          </dd>
        </dl>
        } @else {
          <div class="d-flex justify-content-center py-5">
            <apt-dots></apt-dots>
          </div>
        }
      </div>
    </div>
  </div>
</div>
